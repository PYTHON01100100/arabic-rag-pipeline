# Production-Grade Docker Compose Configuration
# Optimized for vLLM, Ollama, or Gemini deployment

version: '3.8'

services:
  # ============================================================================
  # Main RAG Pipeline (Production Settings)
  # ============================================================================
  rag-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-pipeline-prod
    restart: always

    ports:
      - "8501:8501"

    environment:
      # LLM Provider Selection
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}

      # Gemini Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      # Ollama Configuration
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.7}

      # vLLM Configuration
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-not-needed}
      VLLM_MODEL: ${VLLM_MODEL:-meta-llama/Llama-2-7b-chat-hf}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-2048}
      VLLM_TEMPERATURE: ${VLLM_TEMPERATURE:-0.7}

      # Streamlit Settings
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_CLIENT_LOGGING_LEVEL: "info"
      PYTHONUNBUFFERED: 1

    volumes:
      # Persistent data
      - chroma_db_data:/app/streamlit_chroma_db

    # Resource limits for production
    deploy:
      resources:
        requests:
          cpus: '1.0'
          memory: 2G
        limits:
          cpus: '2.0'
          memory: 4G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Wait for LLM provider to be ready
    depends_on:
      ollama:
        condition: service_healthy
      vllm:
        condition: service_healthy

    networks:
      - rag-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # Ollama Service (Production)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-prod
    restart: always

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    # Resource limits
    deploy:
      resources:
        requests:
          cpus: '2.0'
          memory: 8G
        limits:
          cpus: '4.0'
          memory: 16G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - rag-network

    profiles:
      - ollama

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # vLLM Service (Production with GPU)
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:v0.4.0
    container_name: vllm-prod
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - vllm_cache:/root/.cache

    environment:
      # Model Configuration
      MODEL_NAME: ${VLLM_MODEL:-meta-llama/Llama-2-7b-chat-hf}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}

      # Performance Tuning
      VLLM_USE_V2_BLOCK_MANAGER: 1
      VLLM_ATTENTION_BACKEND: flashinfer
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"

      # API Settings
      VLLM_API_KEY: "not-needed"
      API_TIMEOUT: 120
      API_MAX_BATCH_SIZE: 32

      # Logging
      VLLM_LOGGING_LEVEL: "info"

    # GPU Support (uncomment for production)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        requests:
          cpus: '4.0'
          memory: 8G
        limits:
          cpus: '8.0'
          memory: 16G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # vLLM takes longer to initialize

    networks:
      - rag-network

    profiles:
      - vllm

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # Prometheus Metrics (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

    networks:
      - rag-network

    profiles:
      - monitoring

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  chroma_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CHROMA_DB_PATH:-./chroma_db}

  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OLLAMA_DATA_PATH:-./ollama_data}

  vllm_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VLLM_CACHE_PATH:-./vllm_cache}

  prometheus_data:
    driver: local

networks:
  rag-network:
    driver: bridge
